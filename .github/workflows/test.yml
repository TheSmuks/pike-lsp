name: Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.omc/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '.claude/**'
      - '.omc/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Pike latest toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pike/8.0.1956
            ~/.cache/pike/distfiles
          key: pike-toolchain-${{ runner.os }}-8.0.1956-v1

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-test-pike8.0
          restore-keys: |
            apt-${{ runner.os }}-test-
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Install Pike
        run: |
          sudo apt-get update
          sudo apt-get install -y pike8.0

      - name: Verify Pike installation
        run: |
          pike --version
          which pike

      - name: Build all packages
        run: bun run build

      - name: Run package test suite
        run: bun run test:packages

      - name: Check inline snapshots
        run: cd packages/pike-lsp-server && bun run test:snapshots:check

      - name: Run LSP smoke tests
        run: cd packages/pike-lsp-server && bun test ./src/tests/smoke.test.ts

      - name: Run integration tests
        run: cd packages/pike-lsp-server && bun test ./dist/tests/integration-tests.js

  pike-test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        pike-version: ['8.1116', 'latest']
      fail-fast: true

    continue-on-error: ${{ matrix.pike-version == 'latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-pike-${{ matrix.pike-version }}
          restore-keys: |
            apt-${{ runner.os }}-pike-

      - name: Cache Pike 8.1116 toolchain
        if: matrix.pike-version == '8.1116'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pike/8.0.1116
            ~/.cache/pike/distfiles
          key: pike-toolchain-${{ runner.os }}-8.0.1116-v2

      - name: Cache Pike latest toolchain
        if: matrix.pike-version == 'latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pike/8.0.1956
            ~/.cache/pike/distfiles
          key: pike-toolchain-${{ runner.os }}-8.0.1956-v1

      - name: Install Pike ${{ matrix.pike-version }}
        run: |
          set -euxo pipefail
          if [ "${{ matrix.pike-version }}" = "8.1116" ]; then
            PIKE_VERSION="8.0.1116"
          else
            PIKE_VERSION="8.0.1956"
          fi

          PIKE_PREFIX="$HOME/.cache/pike/${PIKE_VERSION}"
          PIKE_DISTDIR="$HOME/.cache/pike/distfiles"
          PIKE_ARCHIVE="$PIKE_DISTDIR/Pike-v${PIKE_VERSION}.tar.gz"
          PIKE_URL="https://pike.lysator.liu.se/pub/pike/all/${PIKE_VERSION}/Pike-v${PIKE_VERSION}.tar.gz"

          if [ -x "$PIKE_PREFIX/bin/pike" ]; then
            echo "$PIKE_PREFIX/bin" >> "$GITHUB_PATH"
            exit 0
          fi

          mkdir -p "$PIKE_PREFIX" "$PIKE_DISTDIR"
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev nettle-dev nasm bison flex make wget

          download_pike_archive() {
            wget "$PIKE_URL" -O "$PIKE_ARCHIVE" || {
              echo "Pike ${PIKE_VERSION} source archive unavailable"
              exit 1
            }
          }

          if [ ! -f "$PIKE_ARCHIVE" ]; then
            download_pike_archive
          fi

          if ! tar -tzf "$PIKE_ARCHIVE" >/dev/null 2>&1; then
            rm -f "$PIKE_ARCHIVE"
            download_pike_archive
          fi

          if ! tar -tzf "$PIKE_ARCHIVE" >/dev/null 2>&1; then
            echo "Pike ${PIKE_VERSION} archive invalid after redownload"
            exit 1
          fi

          BUILD_DIR="/tmp/pike-${PIKE_VERSION}-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          tar -xzf "$PIKE_ARCHIVE" -C "$BUILD_DIR" --strip-components=1
          cd "$BUILD_DIR/src"
          ./configure --prefix="$PIKE_PREFIX"
          make -j1
          make install
          echo "$PIKE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Verify Pike installation
        run: |
          pike --version
          which pike

      - name: Run Cross-Version Handler Tests
        run: pike test/tests/cross-version-tests.pike

      - name: Run Pike Tests
        run: ./scripts/run-pike-tests.sh

      - name: Cross-version test summary
        if: always()
        run: |
          echo "### Cross-version handler tests : ${{ matrix.pike-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pike version**: ${{ matrix.pike-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Cross-version tests verify all 12 LSP handlers work correctly" >> $GITHUB_STEP_SUMMARY
          echo "- **Test file**: test/tests/cross-version-tests.pike" >> $GITHUB_STEP_SUMMARY

  build-extension:
    runs-on: ubuntu-24.04
    needs: [test, pike-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Build VSIX
        working-directory: packages/vscode-pike
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-pike-extension-${{ github.sha }}
          path: packages/vscode-pike/vscode-pike-*.vsix
          retention-days: 30
          if-no-files-found: error

  vscode-e2e-category:
    name: vscode-e2e (${{ matrix.category }})
    runs-on: ubuntu-24.04
    needs: [test, pike-test]
    timeout-minutes: 25
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - category: core-lsp
            grep: "LSP Feature E2E Tests|Core Regression E2E Tests"
            optional: false
          - category: completion-navigation
            grep: "Smart Completion E2E Tests|Include/Import/Inherit Navigation E2E Tests|Stdlib E2E Tests"
            optional: false
          - category: reliability-workflows
            grep: "Error Handling Tests|Responsiveness E2E Tests|E2E Workflow Tests|Waterfall Loading E2E Tests"
            optional: true
          - category: performance
            grep: "Performance Benchmark Tests"
            optional: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

          PIKE_PREFIX="$HOME/.cache/pike/8.0.1956"
          if [ -x "$PIKE_PREFIX/bin/pike" ]; then
            echo "$PIKE_PREFIX/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get install -y pike8.0
          fi

      - name: Verify Pike installation
        run: |
          pike --version
          which pike

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Bundle LSP server
        run: cd packages/vscode-pike && bun run bundle-server

      - name: Build VSCode extension tests
        run: cd packages/vscode-pike && bun run build:test

      - name: Run VSCode unit tests
        working-directory: packages/vscode-pike
        run: bun test src/test/mockOutputChannel.test.ts

      - name: Run VSCode E2E category suite
        working-directory: packages/vscode-pike
        env:
          SKIP_PREBUILD: '1'
        run: |
          if [ "${{ matrix.optional }}" = "true" ]; then
            set +e
            bash scripts/test-headless.sh --grep "${{ matrix.grep }}"
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              echo "::warning::Optional E2E category '${{ matrix.category }}' failed with exit code $status"
              echo "- Optional category failed: ${{ matrix.category }} (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            bash scripts/test-headless.sh --grep "${{ matrix.grep }}"
          fi

      - name: VSCode E2E category summary
        if: always()
        run: |
          echo "### VSCode E2E Category" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Category: ${{ matrix.category }}" >> $GITHUB_STEP_SUMMARY
          echo "- Grep: ${{ matrix.grep }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the 'Run VSCode E2E category suite' step above for results." >> $GITHUB_STEP_SUMMARY

  vscode-e2e:
    name: vscode-e2e
    runs-on: ubuntu-24.04
    needs: [vscode-e2e-category]
    if: always()

    steps:
      - name: Validate matrix aggregate result
        run: |
          if [ "${{ needs.vscode-e2e-category.result }}" != "success" ]; then
            echo "Required VSCode E2E categories failed."
            exit 1
          fi
          echo "Required VSCode E2E categories passed."

  vscode-e2e-source-trees:
    runs-on: ubuntu-24.04
    needs: [test, pike-test]
    if: ${{ vars.PIKE_SRC != '' && vars.ROXEN_SRC != '' }}
    timeout-minutes: 35

    env:
      PIKE_SRC: ${{ vars.PIKE_SRC }}
      ROXEN_SRC: ${{ vars.ROXEN_SRC }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pike8.0

      - name: Validate source tree paths
        run: |
          if [ ! -d "$PIKE_SRC" ]; then
            echo "PIKE_SRC does not exist: $PIKE_SRC"
            exit 1
          fi
          if [ ! -d "$ROXEN_SRC" ]; then
            echo "ROXEN_SRC does not exist: $ROXEN_SRC"
            exit 1
          fi

          if [ -d "$PIKE_SRC/lib/modules" ] && [ -d "$PIKE_SRC/lib/include" ]; then
            echo "PIKE source root layout detected"
          elif [ "$(basename "$PIKE_SRC")" = "modules" ] && [ -d "$(dirname "$PIKE_SRC")/include" ]; then
            echo "PIKE module tree layout detected"
          else
            echo "PIKE_SRC must be either Pike root (with lib/modules + lib/include) or a modules directory with sibling include"
            exit 1
          fi

          if [ ! -d "$ROXEN_SRC/server" ]; then
            echo "ROXEN_SRC must point to Roxen root containing a server directory"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Run Source-Tree VSCode E2E Matrix
        working-directory: packages/vscode-pike
        run: USE_XVFB=1 bun run test:headless --grep "Source Tree VSCode E2E Feature Matrix"

      - name: Source-Tree E2E Summary
        if: always()
        run: |
          echo "### Source-Tree VSCode E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PIKE_SRC configured: yes" >> $GITHUB_STEP_SUMMARY
          echo "- ROXEN_SRC configured: yes" >> $GITHUB_STEP_SUMMARY
          echo "- Suite: Source Tree VSCode E2E Feature Matrix" >> $GITHUB_STEP_SUMMARY
